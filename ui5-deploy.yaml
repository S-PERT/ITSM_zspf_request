# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zsp.itsm.zspfrequest
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertErrors: true
        target:
          url: https://saphana2.s-pert.com:44360
          client: '100'
        credentials:
          username: env:UI5_DEPLOY_USERNAME
          password: env:UI5_DEPLOY_PASSWORD
        app:
          name: ZSPF_REQUEST
          description: 고객업체 요청관리
          package: ZSP_ITSM_REQUEST
          transport: SPDK903932
        exclude:
          - /test/
          - /localService/
